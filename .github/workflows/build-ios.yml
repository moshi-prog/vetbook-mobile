name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Expo Prebuild (Generate native iOS project)
        env:
          EXPO_PUBLIC_API_URL: https://vetbook-backend.onrender.com/api
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Archive without Code Signing
        env:
          EXPO_PUBLIC_API_URL: https://vetbook-backend.onrender.com/api
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme $SCHEME from $WORKSPACE..."
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VetBook.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_BUILD_SETTINGS_OVERRIDE=""

      - name: Package .ipa for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -r build/VetBook.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r VetBook.ipa Payload
          ls -lh VetBook.ipa

      - name: Upload VetBook IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VetBook-iOS-IPA
          path: build/VetBook.ipa
          retention-days: 7

